services:
  postgres:
    image: postgres:17
    container_name: cryptowallet-db
    environment:
      POSTGRES_DB: cryptowallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cryptowallet-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cryptowallet-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      COINCAP_API_KEY: ${COINCAP_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cryptowallet
    ports:
      - "8080:8080"

volumes:
  cryptowallet-data:
